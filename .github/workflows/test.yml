name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      mysql:
        # -debian variant is a smaller base than the default (oraclelinux),
        # which matters because the runner has limited free disk.
        image: mirror.gcr.io/library/mysql:8.0.46-debian
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --start-period=30s

    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DB_NAME: tutor
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"

    steps:
      # Service containers start before any step, so this only frees disk for
      # the pip install below, not for the mysql service itself.
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: false
          large-packages: false

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
